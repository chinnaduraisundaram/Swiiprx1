<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <div id="site-nav" data-active="all-tasks"></div>
  <div class="page-head"><div class="page-head-inner"><div>
    <h1 id="title">Planned task</h1>
    <p><span class="badge planned">Planned</span> This tool is not built yet.</p>
  </div></div></div>

      <h2>Purpose</h2><p id="purpose"></p>
      <h2>Expected inputs</h2><ul id="inputs"></ul>
      <h2>Expected outputs</h2><ul id="outputs"></ul>
    </section>
    <section class="placeholder" aria-disabled="true">
      <h2>Preview (not functional)</h2>
      <textarea rows="4" disabled placeholder="Inputs will go here"></textarea>
      <div class="row"><button type="button" disabled>Run</button><span>Nothing is connected to this page.</span></div>
    </section>
    <p><a href="/#tasks">&larr; Back to all tasks</a></p>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/planned.js"></script>
