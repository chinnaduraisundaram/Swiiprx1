<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV Viewer - Swiipr Support Portal</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/site.css?v=20261104f">
</head>
<body>
  <div id="site-nav" data-active="csv-viewer"></div>
  <div class="page-head"><div class="page-head-inner"><div>
    <h1>CSV Viewer / Cleaner</h1>
    <p>Open a CSV from your computer, search and filter, then download the filtered rows. The file never leaves your browser.</p>
  </div></div></div>
  <main class="page">
    <section>
      <div class="row">
        <input id="file" type="file" accept=".csv,.txt,text/csv,text/plain">
        <input id="query" type="text" placeholder="Search..." disabled>
        <select id="column" disabled><option value="-1">All columns</option></select>
        <button id="download" type="button" disabled>Download filtered CSV</button>
      </div>
      <div class="row"><span id="info">No file loaded.</span></div>
      <div class="table-wrap"><table id="grid"></table></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/layout.js?v=20261104f"></script>
  <script type="module" src="/js/csv-viewer.js?v=20261104f"></script>
</body>
</html>
