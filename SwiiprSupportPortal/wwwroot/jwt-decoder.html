<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JWT Decoder - Swiipr Support Portal</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/site.css?v=20261104f">
</head>
<body>
  <div id="site-nav" data-active="jwt-decoder"></div>
  <div class="page-head"><div class="page-head-inner"><div>
    <h1>JWT Decoder</h1>
    <p>Decode a token locally. It is never sent anywhere, stored or logged. Decoding does not verify the signature.</p>
  </div></div></div>
  <main class="page">
    <section>
      <h2>Token</h2>
      <textarea id="jwt" rows="5" spellcheck="false" autocomplete="off" placeholder="eyJ..."></textarea>
      <div class="row"><button id="clear" type="button">Clear</button><span id="status"></span></div>
    </section>
    <section>
      <h2>Header</h2><pre id="header" class="json">-</pre>
      <h2>Payload</h2><pre id="payload" class="json">-</pre>
      <h2>Times</h2><div id="times">-</div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/layout.js?v=20261104f"></script>
  <script type="module" src="/js/jwt-decoder.js?v=20261104f"></script>
</body>
</html>
